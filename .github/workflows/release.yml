name: Release

on:
  push:
    tags: ['v*']

jobs:
  # Builds the .wasm grammars from the grammars/ submodules. Separate job with
  # no id-token permission, so the toolchain it installs cannot reach the npm
  # publishing credential.
  build-wasm:
    uses: ./.github/workflows/build-wasm.yml

  publish:
    needs: build-wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      # No submodules: the grammars are only needed to build the .wasm, which
      # build-wasm already did. This job runs first-party actions only.
      - uses: actions/checkout@v4

      # OIDC trusted publishing needs npm >= 11.5.1. Pin npm 11 —
      # npm 12 dropped Node 20 support.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g npm@11

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: .

      - name: Check tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      # The .wasm files are the whole package and are no longer in git, so
      # verify they crossed over from build-wasm and into the tarball.
      - name: Check the .wasm grammars are in the tarball
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e "
            const files = require(process.env.RUNNER_TEMP + '/pack.json')[0].files;
            for (const w of ['tree-sitter-swift.wasm', 'tree-sitter-kotlin.wasm']) {
              const f = files.find((x) => x.path === w);
              if (!f) { console.error('missing from tarball: ' + w); process.exit(1); }
              if (f.size < 1e6) { console.error(w + ' is only ' + f.size + ' bytes'); process.exit(1); }
              console.log(w + '  ' + f.size + ' bytes');
            }
          "

      # Behavioural gates on the freshly built artifacts.
      - run: npm run smoke
      - run: npm run plugins

      # No registry-url needed: OIDC trusted publishing uses no .npmrc auth.
      - run: npm publish
